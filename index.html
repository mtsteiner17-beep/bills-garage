<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bill's Garage — Maintenance Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --card:#383838; --surface:#1F1F1F; --surface2:#1A1A1A;
  --btn-grey:#4A4A4A; --line:#2c2c2c;
  --green:#12FF54; --yellow:#FFC531; --red:#FF453A; --red-deep:#5E0B0B;
  --text:#FFFFFF; --text-dim:#B9B9B9; --text-faint:#8A8A8A;
  --r-card:12px; --r-pill:99px; --r-sheet:28px;
  --font-body:'Public Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-title:'Bebas Neue','Arial Narrow',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0a0a0a;color:var(--text);font-family:var(--font-body);font-size:15px;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
#app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:110px;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.view.active{animation:none}}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(#000 78%,rgba(0,0,0,0));padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.garage-title{font-family:var(--font-title);font-size:34px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:6px;}
.garage-title .chev{font-size:16px;color:var(--text-dim);font-family:var(--font-body);}
.round-btn{width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--btn-grey);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}
.round-btn.small{width:36px;height:36px;font-size:20px;}
.round-btn svg{width:20px;height:20px;}

/* ---------- machine carousel ---------- */
.carousel{display:flex;gap:12px;overflow-x:auto;padding:6px 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;}
.carousel::-webkit-scrollbar{display:none;}
.machine-card{scroll-snap-align:start;flex:0 0 148px;border-radius:14px;overflow:hidden;background:var(--surface);text-align:left;padding:0;position:relative;}
.machine-card .art{height:110px;display:flex;align-items:center;justify-content:center;position:relative;}
.machine-card .art svg{width:118px;height:74px;}
.machine-card .mname{font-family:var(--font-title);font-size:19px;letter-spacing:.5px;padding:8px 10px 2px;line-height:1.05;}
.machine-card .mread{font-size:11px;color:var(--text-dim);padding:0 10px 8px;}
.machine-card .chips{padding:0 10px 10px;display:flex;gap:6px;flex-wrap:wrap;}
.add-card{flex:0 0 120px;height:188px;border:1.5px solid #fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;background:transparent;}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--text-faint);color:#fff;border-radius:var(--r-pill);padding:3px 9px;font-size:12px;font-weight:600;background:rgba(0,0,0,.35);}
.chip svg{width:13px;height:13px;}
.chip.warn{border-color:var(--yellow);color:var(--yellow);}
.chip.over{border-color:var(--red);color:#FF7A70;}
.chip.ok{border-color:var(--green);color:var(--green);}

/* ---------- sections & lists ---------- */
.section-title{font-size:20px;font-weight:600;padding:18px 16px 10px;}
.section-title.small{font-size:16px;padding-top:14px;}
.list{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.mrow{background:var(--card);border-radius:var(--r-card);padding:12px 14px;display:block;width:100%;text-align:left;}
.mrow .r1{display:flex;align-items:center;gap:8px;}
.mrow .mtitle{font-family:var(--font-title);font-size:19px;letter-spacing:.5px;flex:1;text-align:center;line-height:1;}
.mrow .due{font-size:14px;margin-top:8px;color:#fff;}
.mrow .lastdone{font-size:12px;color:var(--text-dim);margin-top:3px;}
.progress{height:6px;border-radius:99px;background:#101010;margin-top:9px;overflow:hidden;}
.progress > i{display:block;height:100%;border-radius:99px;background:var(--green);}
.progress > i.warn{background:var(--yellow);}
.progress > i.over{background:var(--red);}
.log-btn{background:#fff;color:#000;font-weight:600;border-radius:var(--r-pill);padding:8px 18px;font-size:14px;min-height:36px;}
.log-btn.small{padding:6px 14px;font-size:13px;}
.mrow.overdue{background:linear-gradient(160deg,#8E1210 0%,var(--red-deep) 55%,#380404 100%);border:1.5px solid var(--red);}
.mrow.overdue .big-log{margin-top:12px;display:flex;gap:10px;align-items:center;}
.mrow.overdue .big-log .log-btn{flex:1;min-height:52px;font-size:16px;border-radius:var(--r-pill);}
.icon-actions{display:flex;gap:8px;}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--btn-grey);display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:21px;height:21px;}
.empty-card{background:var(--surface);border-radius:var(--r-card);padding:22px 16px;text-align:center;color:var(--text-dim);margin:0 16px;}
.empty-card b{color:#fff;display:block;font-size:16px;margin-bottom:6px;}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);z-index:50;padding:10px 22px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),#000 38%);display:flex;justify-content:space-around;}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:11px;font-weight:600;min-width:64px;min-height:48px;justify-content:center;}
.tabbar button svg{width:24px;height:24px;}
.tabbar button.active{color:#fff;}

/* ---------- detail screens ---------- */
.detail-head{padding:14px 16px 4px;display:flex;align-items:center;gap:12px;}
.detail-head .back{width:44px;height:44px;border-radius:50%;background:var(--btn-grey);display:flex;align-items:center;justify-content:center;font-size:20px;}
.detail-head h1{font-family:var(--font-title);font-size:30px;margin:0;letter-spacing:.5px;flex:1;line-height:1;}
.hero-art{margin:10px 16px 0;border-radius:14px;background:var(--surface);height:170px;display:flex;align-items:center;justify-content:center;}
.hero-art svg{width:250px;height:130px;}
.reading-box{margin:12px 16px 0;background:var(--surface);border-radius:var(--r-card);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.reading-box .val{font-family:var(--font-title);font-size:32px;line-height:1;}
.reading-box .lbl{font-size:12px;color:var(--text-dim);}
.tabrow{display:flex;gap:8px;padding:16px 16px 4px;}
.tabrow button{flex:1;padding:11px 0;border-radius:var(--r-pill);background:var(--surface);color:var(--text-dim);font-weight:600;font-size:14px;min-height:44px;}
.tabrow button.active{background:#fff;color:#000;}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:14px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-dim);}
.kv .v{font-weight:600;text-align:right;}
.panel{margin:12px 16px 0;background:var(--surface);border-radius:var(--r-card);padding:6px 16px 10px;}
.panel.flat{background:var(--card);}
.note-card{background:var(--card);border-radius:var(--r-card);padding:12px 14px;text-align:left;width:100%;}
.note-card .ndate{font-size:12px;color:var(--text-dim);margin-top:6px;}
.pin{color:var(--yellow);font-size:12px;font-weight:700;}

/* ---------- sheets & forms ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:none;}
.sheet-wrap.open{display:block;}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.65);}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);max-height:92vh;overflow-y:auto;background:#141414;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease;}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet .handle{width:44px;height:5px;border-radius:99px;background:#555;margin:2px auto 14px;}
.sheet h2{font-family:var(--font-title);font-size:27px;margin:0 0 4px;letter-spacing:.5px;}
.sheet .sub{color:var(--text-dim);font-size:13px;margin-bottom:14px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;min-height:48px;}
.field textarea{min-height:76px;resize:vertical;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.btn-primary{background:#fff;color:#000;font-weight:600;border-radius:var(--r-pill);width:100%;min-height:52px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-secondary{background:var(--btn-grey);color:#fff;font-weight:600;border-radius:var(--r-pill);width:100%;min-height:52px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-text{color:var(--text-dim);font-weight:600;min-height:44px;padding:8px 12px;}
.btn-danger{color:#FF7A70;font-weight:600;min-height:44px;}
.btn-row{display:flex;gap:10px;}
.btn-row > *{flex:1;}
.toggle-row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;min-height:56px;}
.toggle-row .ticon{width:38px;height:38px;border-radius:50%;background:var(--btn-grey);display:flex;align-items:center;justify-content:center;flex:0 0 38px;}
.toggle-row .ticon svg{width:19px;height:19px;}
.toggle-row .tt{flex:1;}
.toggle-row .tt b{display:block;font-size:15px;}
.toggle-row .tt span{font-size:12px;color:var(--text-dim);}
.switch{width:52px;height:30px;border-radius:99px;background:#555;position:relative;flex:0 0 52px;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on{background:var(--green);}
.switch.on::after{left:25px;background:#000;}
.check-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-faint);flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;}
.check-dot.on{background:var(--green);border-color:var(--green);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.pad button{background:var(--surface);border-radius:12px;min-height:62px;font-size:24px;font-weight:600;}
.pad button:active{background:var(--btn-grey);}
.pad-display{font-family:var(--font-title);font-size:46px;text-align:center;letter-spacing:2px;padding:8px 0 2px;}
.pad-unit{text-align:center;color:var(--text-dim);font-size:13px;}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{padding:11px 16px;border-radius:var(--r-pill);background:var(--surface);font-weight:600;font-size:14px;min-height:46px;border:1.5px solid transparent;}
.seg button.active{background:#fff;color:#000;}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:16px;font-weight:600;min-height:56px;}
.menu-item:last-child{border-bottom:none;}
.menu-item .ticon{width:42px;height:42px;border-radius:50%;background:var(--btn-grey);display:flex;align-items:center;justify-content:center;}
.menu-item .ticon svg{width:20px;height:20px;}
.menu-item .arr{margin-left:auto;color:var(--text-faint);}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:120;background:#fff;color:#000;border-radius:var(--r-pill);padding:12px 18px;font-weight:600;font-size:14px;display:none;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;}
.toast.show{display:flex;}
.toast button{color:#0a58ca;font-weight:700;}
.nudge{margin:0 16px 12px;background:#26260f;border:1.5px solid var(--yellow);border-radius:var(--r-card);padding:13px 15px;display:flex;gap:10px;align-items:center;}
.nudge .nt{flex:1;}
.nudge b{display:block;font-size:15px;}
.nudge span{font-size:13px;color:var(--text-dim);}
.warranty-card{margin:0 16px 12px;background:#12260f;border:1.5px solid var(--green);border-radius:var(--r-card);padding:13px 15px;}
.warranty-card b{display:block;font-size:15px;}
.warranty-card span{font-size:13px;color:var(--text-dim);}
.group-label{font-size:13px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;padding:16px 16px 8px;}
.disclaimer{font-size:12px;color:var(--text-faint);padding:10px 16px 0;line-height:1.5;}
.searchbar{padding:4px 16px 0;}
.searchbar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:13px 18px;min-height:48px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.stat{background:var(--surface);border-radius:var(--r-card);padding:14px;}
.stat .sv{font-family:var(--font-title);font-size:28px;line-height:1;}
.stat .sl{font-size:12px;color:var(--text-dim);margin-top:4px;}
.check-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.check-item:last-child{border-bottom:none;}
.check-item .ct{flex:1;font-size:15px;}
.check-item.done .ct{color:var(--text-faint);text-decoration:line-through;}
.bar-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:7px 0;}
.bar-row .bl{width:96px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .track{flex:1;height:10px;background:#101010;border-radius:99px;overflow:hidden;}
.bar-row .track i{display:block;height:100%;background:var(--green);border-radius:99px;}
.bar-row .bv{width:64px;text-align:right;font-weight:600;}
.onboard{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;padding:34px 24px calc(28px + env(safe-area-inset-bottom));}
.onboard.open{display:flex;}
.onboard .olineup{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.onboard h1{font-family:var(--font-title);font-size:44px;margin:0 0 8px;letter-spacing:.5px;line-height:1;}
.onboard p{color:var(--text-dim);font-size:16px;line-height:1.55;margin:0 0 22px;}
.dots{display:flex;gap:7px;justify-content:center;margin:18px 0;}
.dots i{width:8px;height:8px;border-radius:50%;background:#444;}
.dots i.on{background:#fff;}
@media print{ .tabbar,.topbar,.no-print{display:none!important;} #app{padding-bottom:0;} body{background:#fff;color:#000;} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet-bg" id="sheetBg"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" style="display:none">Undo</button></div>
<div class="onboard" id="onboard"></div>

  const base = (DB.templates[category]||DB.templates.other).map(t => JSON.parse(JSON.stringify(t)));
  const mk = (make||"").toLowerCase(), md = (model||"").toLowerCase();
  for(const m of DB.models){
    if(mk.includes(m.make) && (md.includes(m.model) || m.model.includes(md) || md==="")){
      for(const ov of m.overrides){
        const t = base.find(x=>x.id===ov.id);
        if(t){ Object.assign(t, ov); }
      }
    }
  }
  return base;

/* ================= due engine ================= */
function machineById(id){ return S.machines.find(m=>m.id===id); }
function itemsFor(mid){ return S.items.filter(i=>i.machineId===mid && i.enabled); }
function readingsFor(mid){ return S.readings.filter(r=>r.machineId===mid).sort((a,b)=>a.date<b.date?-1:1); }

function effInterval(item, machine){
  // severe-duty toggle swaps in the severe interval when the template defines one
  let iv = JSON.parse(JSON.stringify(item.interval||{}));
  if(item.severe && item.severeInterval) iv = JSON.parse(JSON.stringify(item.severeInterval));
  return iv;
}
/* returns {status:'ok'|'soon'|'over', pct, remainingTxt, etaDate, dueReading, dueDate} */
function itemStatus(item, machine){
  const iv = effInterval(item, machine);
  const cur = machine.current;
  const leadDays = item.reminderLeadDays!=null ? item.reminderLeadDays : S.settings.defaultLeadDays;
  let usagePct=0, usageLeft=null, usageUnit=null, usageDue=null;   // fraction of usage interval consumed
  let timePct=0, timeLeftDays=null, timeDue=null;
  const useKey = Object.keys(iv).find(k=>k==="hours"||k==="miles"||k==="km");
  if(useKey && iv[useKey] && item.lastReading!=null){
    const span = iv[useKey], used = cur - item.lastReading;
    usagePct = Math.max(0, used/span);
    const left = span - used;
    usageLeft = left; usageUnit = useKey; usageDue = item.lastReading + span;
  }
  if(iv.months && item.lastDate){
    const dueD = addMonths(item.lastDate, iv.months);
    const totalDays = daysBetween(item.lastDate, dueD);
    const el = daysBetween(item.lastDate, todayStr());
    timePct = totalDays>0 ? el/totalDays : 1;
    timeLeftDays = daysBetween(todayStr(), dueD); timeDue = dueD;
  }
  if(item.first && item.first.done!==true && item.firstHoursOrMiles!=null){
    // break-in rule handled as an extra usage gate
  }
  const pct = Math.max(usagePct, timePct);
  // snooze
  const snoozed = item.snoozedUntil && daysBetween(todayStr(), item.snoozedUntil) >= 0;
  let status = "ok";
  if(pct >= 1) status = "over";
  else{
    const usageNear = usageLeft!=null && usageLeft <= (iv[useKey]||0)*0.25;
    const timeNear = timeLeftDays!=null && timeLeftDays <= leadDays;
    if(usageNear || timeNear) status = "soon";
  }
  // eta from recent usage rate
  let etaDate=null, rateTxt=null, etaUses=null;
  const rs = readingsFor(machine.id);
  if(rs.length>=2){
    const a=rs[rs.length-2], b=rs[rs.length-1];
    const dDays = Math.max(1, daysBetween(a.date,b.date)), dUse = Math.max(0, b.value-a.value);
    const perDay = dUse/dDays;
    if(perDay>0 && usageLeft!=null && usageLeft>0){
      const days = usageLeft/perDay;
      etaDate = addDays(todayStr(), Math.round(days));
      const usesLabel = (DB.categories[machine.category]||{}).usesLabel || "use";
      const avgSession = dUse/1; etaUses = Math.max(1, Math.ceil(usageLeft/Math.max(0.5,avgSession)));
      rateTxt = `In ~${etaUses} ${usesLabel}${etaUses>1?"s":""} or ${Math.round(usageLeft)} ${UNIT_LABEL[usageUnit]||usageUnit}`;
    } else if(perDay<=0 && usageLeft!=null && usageLeft>0){
      rateTxt = `${Math.round(usageLeft)} ${UNIT_LABEL[usageUnit]||usageUnit} left`;
    }
  } else if(usageLeft!=null && usageLeft>0){
    rateTxt = `${Math.round(usageLeft)} ${UNIT_LABEL[usageUnit]||usageUnit} left`;
  }
  if(timeLeftDays!=null){
    if(timeLeftDays<0){ status="over"; rateTxt = `Overdue by ${-timeLeftDays}d`; }
    else if(status!=="over" && rateTxt && timeDue && etaDate && timeDue<etaDate){ rateTxt = `${rateTxt} · ${fmtDate(timeDue)}`; }
    else if(!rateTxt){ rateTxt = timeLeftDays===0 ? "Due today" : `Due ${fmtDate(timeDue)}`; }
  }
  if(status==="over" && usageLeft!=null && usageLeft<=0 && timeLeftDays>=0){
    rateTxt = `Overdue by ${Math.round(-usageLeft)} ${UNIT_LABEL[usageUnit]||usageUnit}`;
  }
  if(snoozed && status==="over") status = "soon"; // snoozed hides the red card
  return { status, pct:Math.min(1,pct), remainingTxt:rateTxt||"—", etaDate, dueReading:usageDue, dueDate:timeDue, snoozed };
}
function urgencyRank(st){ return st.status==="over"?0:st.status==="soon"?1:2; }
function allUpcoming(){
  const out=[];
  for(const it of S.items){ if(!it.enabled) continue; const m=machineById(it.machineId); if(!m||m.archived) continue;
    out.push({ item:it, machine:m, st:itemStatus(it,m) }); }
  out.sort((a,b)=> urgencyRank(a.st)-urgencyRank(b.st) || b.st.pct-a.st.pct);
  return out;
}
function lastDoneTxt(item, machine){
  if(item.lastReading==null && !item.lastDate) return "Never logged";
  const u = UNIT_LABEL[machine.unit] ? ` · ${item.lastReading} ${UNIT_LABEL[machine.unit]}` : "";
  return `Last done ${fmtDate(item.lastDate)}${item.lastReading!=null?u:""}`;
}
function machineWorstStatus(m){
  const items = itemsFor(m.id);
  let worst="ok";
  for(const it of items){ const st=itemStatus(it,m).status; if(st==="over") return "over"; if(st==="soon") worst="soon"; }
  return worst;
}

/* ================= shell ================= */
const TABS = [

/* ================= GARAGE (home) ================= */
function viewGarage(){
  const machines = S.machines.filter(m=>!m.archived);
  const up = allUpcoming();
  let h = `<div class="topbar"><div class="garage-title">BILL'S GARAGE</div>

  h += `<div class="carousel">`;
  for(const m of machines){
    const worst = machineWorstStatus(m);
    const chips = itemsFor(m.id).map(it=>({it,st:itemStatus(it,m)})).filter(x=>x.st.status!=="ok").slice(0,3);
    h += `<button class="machine-card" onclick="go('machine',{machineId:'${m.id}',tab:'upcoming'})">
      <div class="art" style="background:radial-gradient(circle at 50% 35%, hsla(${m.photoHue},60%,35%,.55), transparent 75%)">${machineArt(m)}</div>

    </button>`;
  }
  h += `<button class="add-card" onclick="startAddMachine()"><span class="round-btn">+</span>Add machine</button></div>`;
  // stale reading nudge
  for(const m of machines){
    const rs = readingsFor(m.id);
    const lastR = rs[rs.length-1];
    if(lastR && daysBetween(lastR.date, todayStr()) >= 14){
      h += `<div class="nudge"><div class="nt"><b>Update ${esc(m.name)} ${m.unit==="hours"?"hours":"odometer"}?</b><span>No reading in ${daysBetween(lastR.date,todayStr())} days — estimates drift without it.</span></div><button class="log-btn small" onclick="openReadingPad('${m.id}')">Update</button></div>`;
    }
  }
  // warranty expiring
  const soonW = S.warranties.filter(w=>{ const m=machineById(w.machineId); return m&&!m.archived&&w.end&&daysBetween(todayStr(),w.end)>=0&&daysBetween(todayStr(),w.end)<=30; });
  for(const w of soonW){
    const m = machineById(w.machineId);
    h += `<div class="warranty-card"><b>Warranty ends in ${daysBetween(todayStr(),w.end)} days — ${esc(m.name)}</b><span>${esc(w.provider)} · ${esc(w.coverage)} · ends ${fmtDateLong(w.end)}</span></div>`;
  }
  h += `<div class="section-title">Upcoming maintenance</div><div class="list">`;
  if(!up.length) h += `<div class="empty-card"><b>Nothing scheduled</b>Add a machine and its maintenance schedule to get started.</div>`;
  for(const u of up.slice(0,12)){

  }

  h += `</div><div class="disclaimer">Intervals marked “general guideline” are starting points — check your owner's manual.</div>`;
  return h;
}
function shortTitle(t){ return t.replace(/ \/.*$/,"").replace(/ clean \/ replace/i,""); }
function upcomingRow(u){
  const {item:m2, machine, st} = u;
  const pct = Math.round(st.pct*100);
  const bar = st.status==="over"?"over":st.status==="soon"?"warn":"";
  if(st.status==="over" && !st.snoozed){
    return `<div class="mrow overdue">
      <div class="r1"><span class="chip over">${icon(m2.icon)} ${esc(shortTitle(m2.title))}</span></div>

      </div>

  }
  const dueTxt = st.status==="soon" ? `<span style="color:var(--yellow);font-weight:700">Due soon</span> — ` : "";
  return `<div class="mrow">
    <div class="r1"><span class="chip ${st.status==="soon"?"warn":""}">${icon(m2.icon)} ${esc(shortTitle(m2.title))}</span></div>
    <div class="mtitle" style="margin-top:8px">${esc(machine.name)}</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
      <div style="flex:1"><div class="due">${dueTxt}${esc(st.remainingTxt)}</div>

      <div class="icon-actions">
        <button class="icon-btn" onclick="openQuickLog('${m2.id}')" aria-label="Log ${esc(m2.title)}" title="Log">${icon("i-check")}</button>
