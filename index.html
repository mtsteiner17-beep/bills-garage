}

/* ================= SCHEDULE ================= */
function viewSchedule(){
  const up = allUpcoming();
  const groups = { over:[], week:[], month:[], later:[] };
  for(const u of up){
    const st = u.st;
    if(st.status==="over") groups.over.push(u);
    else{
      const d = st.etaDate || st.dueDate;
      const n = d ? daysBetween(todayStr(), d) : 999;
      if(n<=7) groups.week.push(u); else if(n<=31) groups.month.push(u); else groups.later.push(u);
    }
  }
  let h = `<div class="topbar"><div class="garage-title">SCHEDULE</div>
    <button class="round-btn" onclick="exportAllICS()" aria-label="Export calendar" style="font-size:0">${icon("i-sched")}</button></div>`;
  const secs = [["over","Overdue"],["week","This week"],["month","This month"],["later","Later"]];
  let any=false;
  for(const [k,label] of secs){
    if(!groups[k].length) continue; any=true;
    h += `<div class="group-label">${label}</div><div class="list">${groups[k].map(upcomingRow).join("")}</div>`;
  }
  if(!any) h += `<div class="empty-card" style="margin-top:20px"><b>All clear</b>Nothing scheduled right now.</div>`;
  h += `<div style="padding:16px"><button class="btn-secondary" onclick="exportAllICS()">Export all upcoming as calendar file (.ics)</button></div>`;
  return h;
}

/* ================= PROFILE ================= */
function viewProfile(){
  const yr = new Date().getFullYear();
  const logsY = S.logs.filter(l=>l.date.startsWith(yr));
  const spentY = logsY.reduce((a,l)=>a+Number(l.total||0),0);
  const fuelY = S.fuel.filter(f=>f.date.startsWith(yr));
  const fuelCostY = fuelY.reduce((a,f)=>a+Number(f.total||0),0);
  let h = `<div class="topbar"><div class="garage-title">PROFILE</div></div>`;
  h += `<div class="section-title">This year</div><div class="stat-grid">
    <div class="stat"><div class="sv">${money(spentY)}</div><div class="sl">Maintenance + repairs</div></div>
    <div class="stat"><div class="sv">${money(fuelCostY)}</div><div class="sl">Fuel</div></div></div>`;
  h += `<div class="section-title">Cost per machine</div><div class="list">`;
  for(const m of S.machines.filter(x=>!x.archived)){
    const spent = S.logs.filter(l=>l.machineId===m.id&&l.date.startsWith(yr)).reduce((a,l)=>a+Number(l.total||0),0);
    const rs = readingsFor(m.id);
    let rate = "";
    if(rs.length>=2 && m.current>rs[0].value){ const span = m.current-rs[0].value; if(span>0) rate = money(spent/span)+` /${UNIT_LABEL[m.unit]||"unit"}`; }
    h += `<div class="mrow"><div class="r1"><span class="mtitle" style="text-align:left">${esc(m.name)}</span><b>${money(spent)}</b></div><div class="lastdone">${esc(rate)} · ${S.logs.filter(l=>l.machineId===m.id).length} services logged</div></div>`;
  }
  h += `</div>`;
  // fuel & MPG for vehicles
  const veh = S.machines.filter(m=>["truck","motorcycle","trailer"].includes(m.category)&&!m.archived&&S.fuel.some(f=>f.machineId===m.id));
  if(veh.length){
    h += `<div class="section-title">Fuel &amp; MPG</div>`;
    for(const m of veh){
      const fs = S.fuel.filter(f=>f.machineId===m.id).sort((a,b)=>a.date<b.date?-1:1);
      const mpgs = [];
      for(let i=1;i<fs.length;i++){ const g=fs[i].gallons; if(g>0) mpgs.push((fs[i].reading-fs[i-1].reading)/g); }
      const avg = mpgs.length? (mpgs.reduce((a,b)=>a+b,0)/mpgs.length):null;
      h += `<div class="panel"><div class="kv"><span class="k">${esc(m.name)}</span><span class="v">${avg?avg.toFixed(1)+" MPG":"—"}</span></div>
        <div class="kv"><span class="k">Fill-ups logged</span><span class="v">${fs.length}</span></div>
        <button class="btn-text" onclick="openFuelSheet('${m.id}')">Log fill-up</button></div>`;
    }
  }
  h += `<div class="section-title">Backup &amp; export</div><div class="list">
    <button class="menu-item" onclick="exportJSON()"><span class="ticon">${icon("i-wrench")}</span>Export backup (JSON)<span class="arr">›</span></button>
    <button class="menu-item" onclick="document.getElementById('importFile').click()"><span class="ticon">${icon("i-receipt")}</span>Restore from backup<span class="arr">›</span></button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    <button class="menu-item" onclick="exportCSV()"><span class="ticon">${icon("i-note")}</span>Export everything (CSV)<span class="arr">›</span></button>
    <button class="menu-item" onclick="printReport()"><span class="ticon">${icon("i-sched")}</span>Service history report (print / PDF)<span class="arr">›</span></button>
  </div>
  <div class="disclaimer">Last backed up: ${S.settings.lastBackup?fmtDateLong(S.settings.lastBackup):"never"}. Your data stays on this device.</div>`;
  h += `<div class="section-title">Settings</div><div class="panel">
    <div class="kv"><span class="k">Remind me ahead by</span><span class="v">${S.settings.defaultLeadDays} days</span></div>
    <div style="padding:8px 0"><div class="seg">${[7,14,30].map(d=>`<button class="${S.settings.defaultLeadDays===d?"active":""}" onclick="setLead(${d})">${d} days</button>`).join("")}</div></div>
  </div>`;
  h += `<div style="padding:16px"><button class="btn-danger" onclick="resetDemo()">Reset to demo data</button></div>`;
  h += `<div class="disclaimer">Bill's Garage v1.0 · template DB v${DB_VERSION} · intervals are starting points — check your owner's manual.</div>`;
  return h;
}

/* ================= SEARCH ================= */
function viewSearch(){
  const q = (route.q||"").toLowerCase();
  let h = `<div class="detail-head"><button class="back" onclick="go('garage')" aria-label="Back">‹</button><h1>SEARCH</h1></div>
  <div class="searchbar"><input id="q" placeholder="Search machines, notes, receipts…" value="${esc(route.q||"")}" oninput="goSilent(this.value)"></div><div class="list" style="margin-top:12px">`;
  if(q){
    const res = [];
    for(const m of S.machines) if((m.name+m.make+m.model).toLowerCase().includes(q)) res.push(`<button class="mrow" onclick="go('machine',{machineId:'${m.id}',tab:'upcoming'})"><div class="r1"><span class="mtitle" style="text-align:left">${esc(m.name)}</span></div><div class="lastdone">${esc(m.make)} ${esc(m.model)}</div></button>`);
    for(const n of S.notes) if(n.body.toLowerCase().includes(q)){ const m=machineById(n.machineId); res.push(`<button class="mrow" onclick="go('machine',{machineId:'${n.machineId}',tab:'notes'})"><div class="lastdone">${esc(m?m.name:"")}</div><div>${esc(n.body.slice(0,120))}</div></button>`); }
    for(const r of S.receipts) if(((r.vendor||"")+(r.category||"")).toLowerCase().includes(q)){ const m=machineById(r.machineId); res.push(`<button class="mrow" onclick="go('machine',{machineId:'${r.machineId}',tab:'history'})"><div class="r1"><span class="mtitle" style="text-align:left">${esc(r.vendor||"Receipt")}</span><b>${money(r.total)}</b></div><div class="lastdone">${esc(m?m.name:"")} · ${fmtDateLong(r.date)}</div></button>`); }
    for(const p of S.parts) if(((p.type||"")+(p.spec||"")+(p.part||"")).toLowerCase().includes(q)){ const m=machineById(p.machineId); res.push(`<button class="mrow" onclick="go('machine',{machineId:'${p.machineId}',tab:'upcoming'})"><div class="lastdone">${esc(m?m.name:"")} · part</div><div><b>${esc(p.type)}</b> — ${esc(p.spec)} ${esc(p.part)}</div></button>`); }
    h += res.length? res.join("") : `<div class="empty-card"><b>No matches</b>Try another word.</div>`;
  }
  h += `</div>`;
  return h;
}
function goSilent(v){ route.q=v; const el=$("#q"); const pos=el.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }
</script>
<script>
/* ================= MACHINE PAGE ================= */
function viewMachine(){
  const m = machineById(route.machineId);
  if(!m) return `<div class="empty-card" style="margin-top:40px"><b>Machine not found</b></div>`;
  const tab = route.tab||"upcoming";
  let h = `<div class="detail-head"><button class="back" onclick="go('garage')" aria-label="Back">‹</button><h1>${esc(m.name)}</h1>
    <button class="round-btn small" onclick="openMachineMenu('${m.id}')" aria-label="More">⋯</button></div>`;
  h += `<div class="hero-art" style="background:radial-gradient(circle at 50% 40%, hsla(${m.photoHue},60%,32%,.6), transparent 78%)">${machineArt(m,"250px","130px")}</div>`;
  h += `<div class="reading-box"><div><div class="val">${m.current!=null?m.current:"—"}</div><div class="lbl">${m.unit==="hours"?"Engine hours":m.unit==="miles"?"Miles":"Reading"}</div></div>
    <button class="log-btn" onclick="openReadingPad('${m.id}')">Update</button></div>`;
  h += `<div class="tabrow">${["upcoming","history","notes"].map(t=>`<button class="${tab===t?"active":""}" onclick="go('machine',{machineId:'${m.id}',tab:'${t}'})">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>`;
  if(tab==="upcoming"){
    const items = itemsFor(m.id).map(it=>({it,st:itemStatus(it,m)}));
    items.sort((a,b)=>urgencyRank(a.st)-urgencyRank(b.st)||b.st.pct-a.st.pct);
    h += `<div class="list" style="margin-top:12px">${items.map(u=>upcomingRow({item:u.it,machine:m,st:u.st})).join("")||'<div class="empty-card"><b>No items</b></div>'}</div>`;
    h += `<div style="padding:12px 16px 0"><button class="btn-secondary" onclick="openAddMaint('${m.id}')">Add maintenance item</button></div>`;
    // spec sheet
    const parts = S.parts.filter(p=>p.machineId===m.id);
    h += `<div class="section-title small">Spec sheet</div><div class="panel">`;
    h += parts.length? parts.map(p=>`<div class="kv"><span class="k">${esc(p.type)}</span><span class="v">${esc(p.spec||p.part||"—")}${p.part&&p.spec?`<br><span style="font-weight:400;color:var(--text-dim)">${esc(p.part)}</span>`:""}</span></div>`).join("") : `<div class="kv"><span class="k">No specs yet</span></div>`;
    h += `<button class="btn-text" onclick="openSpecSheet('${m.id}')">Edit spec sheet</button></div>`;
    // seasonal checklists
    const sc = DB.seasonal[m.category];
    if(sc) h += `<div class="section-title small">Seasonal checklists</div><div class="list">
      <button class="menu-item" onclick="openChecklist('${m.id}','spring')"><span class="ticon">${icon("i-sun")}</span>Spring startup<span class="arr">›</span></button>
      <button class="menu-item" onclick="openChecklist('${m.id}','winter')"><span class="ticon">${icon("i-snow")}</span>Winter storage<span class="arr">›</span></button></div>`;
  } else if(tab==="history"){
    const logs = S.logs.filter(l=>l.machineId===m.id).sort((a,b)=>a.date<b.date?1:-1);
    const total = logs.reduce((a,l)=>a+Number(l.total||0),0);
    h += `<div class="panel" style="margin-top:12px"><div class="kv"><span class="k">Total recorded</span><span class="v">${money(total)}</span></div><div class="kv"><span class="k">Services</span><span class="v">${logs.length}</span></div></div>`;
    h += `<div class="list" style="margin-top:12px">`;
    if(!logs.length) h += `<div class="empty-card"><b>No history yet</b>Log your first service.</div>`;
    for(const l of logs){
      h += `<div class="mrow"><div class="r1"><span class="mtitle" style="text-align:left;font-size:17px">${esc(l.title)}</span><b>${money(l.total)}</b></div>
        <div class="lastdone">${fmtDateLong(l.date)}${l.reading!=null?` · ${l.reading} ${UNIT_LABEL[m.unit]||""}`:""} · ${esc(l.shop||"")}</div>
        ${l.notes?`<div style="font-size:13px;margin-top:6px;color:var(--text-dim)">${esc(l.notes)}</div>`:""}
        <div style="display:flex;gap:6px;margin-top:8px"><button class="btn-text" onclick="deleteLog('${l.id}')">Delete</button></div></div>`;
    }
    h += `</div>`;
  } else {
    const notes = S.notes.filter(n=>n.machineId===m.id).sort((a,b)=>(b.pinned-a.pinned)||(a.date<b.date?1:-1));
    h += `<div class="list" style="margin-top:12px">`;
    if(!notes.length) h += `<div class="empty-card"><b>No notes</b>Jot down anything about this machine.</div>`;
    for(const n of notes){
      h += `<div class="note-card">${n.pinned?'<div class="pin">PINNED</div>':""}<div>${esc(n.body)}</div><div class="ndate">${fmtDateLong(n.date)} · <button class="btn-text" style="padding:0;min-height:0" onclick="togglePin('${n.id}')">${n.pinned?"Unpin":"Pin"}</button> · <button class="btn-text" style="padding:0;min-height:0" onclick="deleteNote('${n.id}')">Delete</button></div></div>`;
    }
    h += `</div><div style="padding:12px 16px 0"><button class="btn-secondary" onclick="openNoteSheet('${m.id}')">Add note</button></div>`;
  }
  h += `<div style="padding:16px"><button class="round-btn" onclick="openAddMenu('${m.id}')" aria-label="Add" style="width:60px;height:60px;font-size:32px;margin:0 auto">+</button></div>`;
  return h;
}

/* ================= TASK DETAIL ================= */
function viewTask(){
  const it = S.items.find(x=>x.id===route.taskId);
  if(!it) return `<div class="empty-card" style="margin-top:40px"><b>Task not found</b></div>`;
  const m = machineById(it.machineId);
  const st = itemStatus(it,m);
  const tpl = (DB.templates[m.category]||[]).find(t=>t.id===it.templateId);
  const conf = tpl?tpl.confidence:"custom";
  const logs = S.logs.filter(l=>l.scheduleItemId===it.id||l.title===it.title&&l.machineId===m.id).sort((a,b)=>a.date<b.date?1:-1);
  let h = `<div class="detail-head"><button class="back" onclick="go('machine',{machineId:'${m.id}',tab:'upcoming'})" aria-label="Back">‹</button><h1>${esc(it.title.toUpperCase())}</h1>
    <button class="round-btn small" onclick="openTaskMenu('${it.id}')" aria-label="Edit">✎</button></div>`;
  h += `<div style="padding:0 16px"><span class="chip ${st.status==="over"?"over":st.status==="soon"?"warn":"ok"}">${icon(it.icon)} ${st.status==="over"?"Overdue":st.status==="soon"?"Due soon":"OK"}</span>
    <span class="chip" style="margin-left:6px">${esc(conf==="general"?"general guideline":"custom")}</span></div>`;
  h += `<div class="panel"><div class="kv"><span class="k">Next due</span><span class="v">${esc(st.remainingTxt)}</span></div>
    <div class="progress" style="margin:6px 0 10px"><i class="${st.status==="over"?"over":st.status==="soon"?"warn":""}" style="width:${Math.round(st.pct*100)}%"></i></div>
    <div class="kv"><span class="k">Interval</span><span class="v">${esc(intervalTxt(it,m))}</span></div>
    <div class="kv"><span class="k">Last done</span><span class="v">${esc(lastDoneTxt(it,m))}</span></div></div>`;
  // what you need
  h += `<div class="section-title small">What you need</div>`;
  const parts = it.parts&&it.parts.length?it.parts:(S.parts.filter(p=>p.machineId===m.id&&p.type&&it.title.toLowerCase().includes(p.type.split(" ")[0])));
  h += `<div class="panel">`;
  if(parts.length) h += parts.map(p=>`<div class="kv"><span class="k">${esc(p.type)}</span><span class="v">${esc(p.spec||"")}${p.part?`<br><button class="btn-text" style="padding:2px 0;min-height:0" onclick="copyTxt('${esc(p.part)}')">Copy part #: ${esc(p.part)}</button>`:""}</span></div>`).join("");
  else h += `<div class="kv"><span class="k">Nothing listed</span></div>`;
  h += `<button class="btn-text" onclick="openSpecSheet('${m.id}')">Edit spec sheet</button></div>`;
  if(it.howTo) h += `<div style="padding:12px 16px 0"><a class="btn-secondary" style="text-decoration:none" href="${esc(it.howTo)}" target="_blank" rel="noopener">How-to guide</a></div>`;
  h += `<div style="padding:12px 16px 0;display:flex;gap:10px"><button class="btn-secondary" onclick="openServiceSearch('${esc(m.category)}')">Find a shop nearby</button></div>`;
  h += `<div class="section-title small">History for this task</div><div class="list">`;
  h += logs.length? logs.map(l=>`<div class="mrow"><div class="r1"><span class="mtitle" style="text-align:left;font-size:16px">${fmtDateLong(l.date)}</span><b>${money(l.total)}</b></div><div class="lastdone">${l.reading!=null?l.reading+" "+(UNIT_LABEL[m.unit]||""):""} · ${esc(l.shop||"")}${l.notes?" — "+esc(l.notes):""}</div></div>`).join("") : `<div class="empty-card"><b>No history</b>Nothing logged for this task yet.</div>`;
  h += `</div><div style="padding:16px"><button class="btn-primary" onclick="openQuickLog('${it.id}')">Log this service</button></div>`;
  if(tpl) h += `<div class="disclaimer">Starting point — check your owner's manual. Source: ${esc(tpl.source||"general guideline")}.</div>`;
  return h;
}
function intervalTxt(it,m){
  const iv = effInterval(it,m);
  const parts=[];
  if(iv.miles) parts.push(`every ${iv.miles.toLocaleString()} mi`);
  if(iv.km) parts.push(`every ${iv.km.toLocaleString()} km`);
  if(iv.hours) parts.push(`every ${iv.hours} hrs`);
  if(iv.months) parts.push(`every ${iv.months} mo`);
  return parts.join(" or ") + (parts.length>1?" (whichever first)":"") + (it.severe?" · severe duty":"");
}
function copyTxt(t){ navigator.clipboard&&navigator.clipboard.writeText(t); toast("Copied: "+t); }
</script>
<script>
/* ================= sheets ================= */
let _sheetWired=false;
function openSheet(html){
  $("#sheet").innerHTML = `<div class="handle"></div>`+html;
  $("#sheetWrap").classList.add("open");
  if(!_sheetWired){ _sheetWired=true;
    $("#sheet").addEventListener("click", e=>{
      const b=e.target.closest(".seg button");
      if(b){ b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); }
    });
  }
  const first = $("#sheet input, #sheet select, #sheet textarea, #sheet button.btn-primary");
  if(first) setTimeout(()=>{ try{first.focus({preventScroll:true})}catch(e){} },250);
}
function closeSheet(){ $("#sheetWrap").classList.remove("open"); }
$("#sheetBg") && $("#sheetBg").addEventListener("click", closeSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
function toast(msg, undoFn){
  const t=$("#toast"); $("#toastMsg").textContent=msg;
  const b=$("#toastBtn");
  if(undoFn){ b.style.display=""; b.onclick=()=>{ undoFn(); t.classList.remove("show"); }; lastUndo=undoFn; }
  else { b.style.display="none"; }
  t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), 4200);
}

/* ================= quick log ================= */
function openQuickLog(itemId){
  const it = S.items.find(x=>x.id===itemId); const m = machineById(it.machineId);
  const st = itemStatus(it,m);
  const others = itemsFor(m.id).filter(o=>o.id!==it.id && itemStatus(o,m).status!=="ok");
  const pred = st.dueReading!=null ? Math.round(Math.max(m.current||0, st.dueReading)) : (m.current||"");
  openSheet(`<h2>Log service</h2><div class="sub">${esc(m.name)} · ${esc(it.title)}</div>
    <div class="field"><label>Date</label><input type="date" id="ql-date" value="${todayStr()}"></div>
    <div class="field"><label>${m.unit==="hours"?"Engine hours":"Odometer"} at service</label><input type="number" id="ql-reading" value="${pred}" inputmode="decimal"></div>
    ${others.length?`<div class="field"><label>Also done now</label>${others.map(o=>`<button class="toggle-row" data-multi="${o.id}" onclick="this.classList.toggle('sel');this.querySelector('.check-dot').classList.toggle('on')"><span class="check-dot">✓</span><span class="tt"><b>${esc(o.title)}</b></span></button>`).join("")}</div>`:""}
    <div class="field-row"><div class="field"><label>Parts cost</label><input type="number" id="ql-parts" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label>Labor cost</label><input type="number" id="ql-labor" inputmode="decimal" placeholder="0"></div></div>
    <div class="field"><label>Shop</label><div class="seg" id="ql-shop"><button class="active" data-v="DIY">DIY</button><button data-v="Shop">Shop</button></div></div>
    <div class="field"><label>Notes</label><textarea id="ql-notes" placeholder="Optional"></textarea></div>
    <button class="btn-primary" onclick="saveQuickLog('${it.id}')">Save log</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>
    <script>$$("#ql-shop button").forEach(b=>b.onclick=()=>{$$("#ql-shop button").forEach(x=>x.classList.remove("active"));b.classList.add("active")})<\/script>`);
}
function saveQuickLog(itemId){
  const it = S.items.find(x=>x.id===itemId); const m = machineById(it.machineId);
  const date = $("#ql-date").value || todayStr();
  const reading = $("#ql-reading").value===""?null:Number($("#ql-reading").value);
  const parts = Number($("#ql-parts").value||0), labor = Number($("#ql-labor").value||0);
  const shop = ($("#ql-shop .active")||{}).dataset?$("#ql-shop .active").dataset.v:"DIY";
  const notes = $("#ql-notes").value;
  const alsoIds = $$("#sheet [data-multi].sel").map(b=>b.dataset.multi);
  const snapshot = JSON.stringify(S);
  const ids = [it.id, ...alsoIds];
  for(const id of ids){
    const o = S.items.find(x=>x.id===id);
    o.lastReading = reading!=null?reading:o.lastReading;
    o.lastDate = date; o.snoozedUntil=null; o.skipped=0;
  }
  const log = { id:uid(), machineId:m.id, scheduleItemId:it.id, date, reading,
    title: ids.length>1 ? ids.map(id=>S.items.find(x=>x.id===id).title).join(" + ") : it.title,
    parts:[], laborCost:labor, shop, total:parts+labor, notes, receiptIds:[], createdAt:todayStr() };
  S.logs.push(log);
  if(reading!=null){ m.current = Math.max(m.current||0, reading); S.readings.push({id:uid(),machineId:m.id,value:reading,date}); }
  save(); closeSheet();
  const st = itemStatus(it,m);
  toast(`Logged ✓  Next: ${st.remainingTxt}`, ()=>{ S=JSON.parse(snapshot); save(); render(); });
  render();
}
function markDoneQuick(itemId){
  const it = S.items.find(x=>x.id===itemId);
  const snapshot = JSON.stringify(S);
  it.lastReading = machineById(it.machineId).current;
  it.lastDate = todayStr(); it.snoozedUntil=null;
  S.logs.push({id:uid(),machineId:it.machineId,scheduleItemId:it.id,date:todayStr(),reading:it.lastReading,title:it.title,parts:[],laborCost:0,shop:"DIY",total:0,notes:"Quick mark-done",receiptIds:[],createdAt:todayStr()});
  save(); render();
  toast("Marked done ✓", ()=>{ S=JSON.parse(snapshot); save(); render(); });
}
function snoozeItem(itemId){
  const it = S.items.find(x=>x.id===itemId);
  openSheet(`<h2>Snooze</h2><div class="sub">${esc(it.title)}</div>
    <div class="field-row"><button class="btn-secondary" onclick="doSnooze('${itemId}',1)">1 day</button>
    <button class="btn-secondary" onclick="doSnooze('${itemId}',7)">1 week</button></div>
    <div class="field" style="margin-top:12px"><label>Custom date</label><input type="date" id="sz-date" value="${addDays(todayStr(),7)}"></div>
    <button class="btn-primary" onclick="doSnooze('${itemId}',null)">Snooze until date</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function doSnooze(itemId,days){
  const it = S.items.find(x=>x.id===itemId);
  it.snoozedUntil = days==null ? ($("#sz-date").value||addDays(todayStr(),7)) : addDays(todayStr(),days);
  save(); closeSheet(); render(); toast("Snoozed ✓");
}
function skipItem(itemId){
  const it = S.items.find(x=>x.id===itemId);
  const snapshot = JSON.stringify(S);
  it.skipped = (it.skipped||0)+1;
  it.lastDate = todayStr(); it.snoozedUntil=null;
  S.logs.push({id:uid(),machineId:it.machineId,scheduleItemId:it.id,date:todayStr(),reading:it.lastReading,title:it.title+" (skipped)",parts:[],laborCost:0,shop:"—",total:0,notes:"Skipped this time",receiptIds:[],createdAt:todayStr()});
  save(); render();
  toast("Skipped — logged so history stays honest", ()=>{ S=JSON.parse(snapshot); save(); render(); });
}
function deleteLog(logId){
  const i = S.logs.findIndex(l=>l.id===logId); if(i<0) return;
  const snapshot = JSON.stringify(S);
  const [gone] = S.logs.splice(i,1); save(); render();
  toast("Log deleted", ()=>{ S=JSON.parse(snapshot); save(); render(); });
}

/* ================= reading pad ================= */
function openReadingPad(mid){
  const m = machineById(mid);
  openSheet(`<h2>Update ${m.unit==="hours"?"hours":"odometer"}</h2><div class="sub">${esc(m.name)}</div>
    <div class="pad-display" id="padVal">${m.current!=null?m.current:"0"}</div><div class="pad-unit">${UNIT_LABEL[m.unit]||""}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"C",0,"⌫"].map(k=>`<button onclick="padKey('${mid}','${k}')">${k}</button>`).join("")}</div>
    <button class="btn-primary" onclick="padSave('${mid}')">Save</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
  window._pad = String(m.current!=null?m.current:"");
}
function padKey(mid,k){
  if(k==="C") window._pad="";
  else if(k==="⌫") window._pad=window._pad.slice(0,-1);
  else window._pad=(window._pad+k).slice(0,7);
  $("#padVal").textContent = window._pad||"0";
}
function padSave(mid){
  const m = machineById(mid);
  const v = Number(window._pad||0);
  m.current = v;
  S.readings.push({id:uid(),machineId:mid,value:v,date:todayStr()});
  save(); closeSheet(); render(); toast("Reading updated ✓");
}

/* ================= + menu ================= */
function openAddMenu(mid){
  const m = mid?machineById(mid):null;
  openSheet(`<h2>Add</h2><div class="sub">${m?esc(m.name):"New"}</div>
    ${m?`<button class="menu-item" onclick="closeSheet();openQuickLogForMachine('${m.id}')"><span class="ticon">${icon("i-check")}</span>Log service<span class="arr">›</span></button>`:""}
    ${m?`<button class="menu-item" onclick="closeSheet();openAddMaint('${m.id}')"><span class="ticon">${icon("i-wrench")}</span>Maintenance item<span class="arr">›</span></button>`:""}
    ${m?`<button class="menu-item" onclick="closeSheet();openReceiptSheet('${m.id}')"><span class="ticon">${icon("i-receipt")}</span>Receipt<span class="arr">›</span></button>`:""}
    ${m?`<button class="menu-item" onclick="closeSheet();openWarrantySheet('${m.id}')"><span class="ticon">${icon("i-warranty")}</span>Warranty<span class="arr">›</span></button>`:""}
    ${m?`<button class="menu-item" onclick="closeSheet();openNoteSheet('${m.id}')"><span class="ticon">${icon("i-note")}</span>Note<span class="arr">›</span></button>`:""}
    ${m&&["truck","motorcycle"].includes(m.category)?`<button class="menu-item" onclick="closeSheet();openFuelSheet('${m.id}')"><span class="ticon">${icon("i-fuel")}</span>Fill-up<span class="arr">›</span></button>`:""}
    <button class="menu-item" onclick="closeSheet();startAddMachine()"><span class="ticon">${icon("i-garage")}</span>Add machine<span class="arr">›</span></button>`);
}
function openQuickLogForMachine(mid){
  const items = itemsFor(mid);
  if(!items.length){ toast("No maintenance items on this machine yet"); return; }
  openSheet(`<h2>Log service</h2><div class="sub">Pick what was done</div>
    ${items.map(o=>`<button class="toggle-row" data-multi="${o.id}" onclick="this.classList.toggle('sel');this.querySelector('.check-dot').classList.toggle('on')"><span class="check-dot">✓</span><span class="tt"><b>${esc(o.title)}</b><span>${esc(lastDoneTxt(o,machineById(mid)))}</span></span></button>`).join("")}
    <div class="field"><label>Date</label><input type="date" id="qlm-date" value="${todayStr()}"></div>
    <div class="field"><label>${machineById(mid).unit==="hours"?"Engine hours":"Odometer"} at service</label><input type="number" id="qlm-reading" inputmode="decimal" value="${machineById(mid).current||""}"></div>
    <div class="field"><label>Total cost</label><input type="number" id="qlm-cost" inputmode="decimal" placeholder="0"></div>
    <button class="btn-primary" onclick="saveQuickLogMulti('${mid}')">Save log</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function saveQuickLogMulti(mid){
  const m = machineById(mid);
  const ids = $$("#sheet [data-multi].sel").map(b=>b.dataset.multi);
  if(!ids.length){ toast("Pick at least one item"); return; }
  const date=$("#qlm-date").value||todayStr();
  const reading=$("#qlm-reading").value===""?null:Number($("#qlm-reading").value);
  const cost=Number($("#qlm-cost").value||0);
  const snapshot=JSON.stringify(S);
  for(const id of ids){ const o=S.items.find(x=>x.id===id); o.lastReading=reading!=null?reading:o.lastReading; o.lastDate=date; o.snoozedUntil=null; }
  S.logs.push({id:uid(),machineId:mid,scheduleItemId:ids[0],date,reading,title:ids.map(id=>S.items.find(x=>x.id===id).title).join(" + "),parts:[],laborCost:0,shop:"DIY",total:cost,notes:"",receiptIds:[],createdAt:todayStr()});
  if(reading!=null){ m.current=Math.max(m.current||0,reading); S.readings.push({id:uid(),machineId:mid,value:reading,date}); }
  save(); closeSheet(); render();
  toast("Logged ✓", ()=>{ S=JSON.parse(snapshot); save(); render(); });
}
</script>
<script>
/* ================= ADD MACHINE flow ================= */
let AM = null; // draft
function startAddMachine(){
  AM = { step:1, category:"riding-mower", make:"", model:"", year:"", unit:"hours", current:"", severe:false, chosen:[], lastDone:{} };
  renderAddMachine();
}
function renderAddMachine(){
  const cats = Object.entries(DB.categories);
  let body = "";
  if(AM.step===1){
    body = `<h2>Add machine</h2><div class="sub">Step 1 of 4 — What kind?</div>
      <div class="seg">${cats.map(([k,c])=>`<button class="${AM.category===k?"active":""}" onclick="AM.category='${k}';AM.unit='${DB.categories[k].units[0]}';renderAddMachine()">${esc(c.label)}</button>`).join("")}</div>
      <div style="height:16px"></div>
      <button class="btn-primary" onclick="AM.step=2;renderAddMachine()">Next</button>`;
  } else if(AM.step===2){
    body = `<h2>Add machine</h2><div class="sub">Step 2 of 4 — Details</div>
      ${["truck","motorcycle"].includes(AM.category)?`<button class="btn-secondary" style="margin-bottom:14px" onclick="vinDecode()">Scan / decode VIN</button><div class="field" id="vinField" style="display:none"><label>VIN</label><input id="am-vin" placeholder="17-character VIN" maxlength="17"></div>`:""}
      <div class="field"><label>Make</label><input id="am-make" list="makes" value="${esc(AM.make)}" placeholder="e.g. Cub Cadet"><datalist id="makes">${[...new Set(DB.models.map(m=>m.make))].map(x=>`<option value="${x}">`).join("")}</datalist></div>
      <div class="field-row"><div class="field"><label>Model</label><input id="am-model" value="${esc(AM.model)}" placeholder="e.g. XT1"></div>
      <div class="field"><label>Year</label><input id="am-year" value="${esc(AM.year)}" inputmode="numeric" placeholder="2021"></div></div>
      <div class="field"><label>Nickname (optional)</label><input id="am-name" placeholder="e.g. The Mower"></div>
      <button class="btn-primary" onclick="amStep2Next()">Next</button>
      <button class="btn-text" style="width:100%" onclick="AM.step=1;renderAddMachine()">Back</button>`;
  } else if(AM.step===3){
    const cat = DB.categories[AM.category];
    body = `<h2>Add machine</h2><div class="sub">Step 3 of 4 — Current ${AM.unit==="hours"?"hours":"reading"}</div>
      <div class="field"><label>Tracks</label><div class="seg">${cat.units.map(u=>`<button class="${AM.unit===u?"active":""}" onclick="AM.unit='${u}';renderAddMachine()">${u==="hours"?"Engine hours":u==="uses"?"Uses ("+cat.usesLabel+")":u}</button>`).join("")}</div></div>
      <div class="field"><label>Current ${AM.unit==="hours"?"engine hours":"odometer"}</label><input id="am-cur" type="number" inputmode="decimal" value="${esc(AM.current)}" placeholder="0"></div>
      <div class="field"><label>Normal or severe duty?</label><div class="seg"><button class="${!AM.severe?"active":""}" onclick="AM.severe=false;renderAddMachine()">Normal</button><button class="${AM.severe?"active":""}" onclick="AM.severe=true;renderAddMachine()">Severe (dusty, towing, short trips)</button></div></div>
      <button class="btn-primary" onclick="amStep3Next()">Next</button>
      <button class="btn-text" style="width:100%" onclick="AM.step=2;renderAddMachine()">Back</button>`;
  } else {
    // suggested schedule
    if(!AM.chosen.length){ AM.chosen = templatesFor(AM.category, AM.make, AM.model).map(t=>({t, on:true})); }
    body = `<h2>Suggested maintenance</h2><div class="sub">Step 4 of 4 — ${esc(AM.make)} ${esc(AM.model)} · starting points, check your manual</div>
      ${AM.chosen.map((c,i)=>{ const t=c.t;
        return `<div class="toggle-row"><span class="ticon">${icon(t.icon)}</span><span class="tt"><b>${esc(t.title)}</b><span>${esc(intervalTxt({interval:t.interval,severe:AM.severe,severeInterval:t.severe}, {unit:AM.unit}))}</span></span><span class="switch ${c.on?"on":""}" onclick="AM.chosen[${i}].on=!AM.chosen[${i}].on;this.classList.toggle('on')"></span></div>`;}).join("")}
      <div class="field" style="margin-top:12px"><label>Last done? (leave blank = due now)</label>
        ${AM.chosen.map((c,i)=>`<div class="field-row" style="margin-bottom:8px"><div class="field" style="margin:0"><input type="date" id="ld-${i}" onchange="AM.lastDone['${c.t.id}']=this.value"></div><div style="align-self:center;font-size:13px;color:var(--text-dim);min-width:110px">${esc(c.t.title.slice(0,18))}</div></div>`).join("")}
      </div>
      <button class="btn-primary" onclick="finishAddMachine()">Add machine</button>
      <button class="btn-text" style="width:100%" onclick="AM.step=3;renderAddMachine()">Back</button>`;
  }
  openSheet(body);
}
function amStep2Next(){
  AM.make=$("#am-make").value.trim(); AM.model=$("#am-model").value.trim(); AM.year=$("#am-year").value.trim();
  AM.name=$("#am-name").value.trim() || (AM.make+" "+AM.model).trim() || "New machine";
  AM.step=3; renderAddMachine();
}
function amStep3Next(){
  AM.current=$("#am-cur").value;
  AM.step=4; renderAddMachine();
}
function finishAddMachine(){
  const id = uid();
  const cur = AM.current===""?null:Number(AM.current);
  const m = { id, name:AM.name.toUpperCase(), category:AM.category, make:AM.make, model:AM.model, year:AM.year,
    unit:AM.unit, current:cur, purchaseDate:todayStr(), notes:"", photoHue:Math.floor(Math.random()*360), archived:false, createdAt:todayStr(), severe:AM.severe };
  S.machines.push(m);
  for(const c of AM.chosen){
    if(!c.on) continue;
    const t=c.t; const ld = AM.lastDone[t.id];
    const iv = AM.severe&&t.severe?Object.assign({},t.interval,t.severe):Object.assign({},t.interval);
    S.items.push({ id:uid(), machineId:id, templateId:t.id, title:t.title, icon:t.icon,
      interval:iv, first:t.first||null, lastReading:ld?(cur):null, lastDate:ld||null,
      reminderLead:null, enabled:true, parts:t.parts||[], howTo:t.howTo||"", notes:"", snoozedUntil:null, severe:AM.severe, skipped:0 });
  }
  if(cur!=null) S.readings.push({id:uid(),machineId:id,value:cur,date:todayStr()});
  save(); closeSheet(); AM=null;
  go("machine",{machineId:id,tab:"upcoming"});
  toast("Machine added ✓");
}
function vinDecode(){
  const f=$("#vinField"); f.style.display = f.style.display==="none"?"":"none";
  if(f.style.display!=="none"){
    $("#am-vin").addEventListener("change", async e=>{
      const vin=e.target.value.trim().toUpperCase();
      if(vin.length!==17){ toast("VIN must be 17 characters"); return; }
      try{
        const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/${vin}?format=json`);
        const j = await r.json(); const v = j.Results[0];
        if(v.ModelYear&&v.ModelYear!=="Not Applicable") $("#am-year").value=v.ModelYear;
        if(v.Make) $("#am-make").value=v.Make;
        if(v.Model) $("#am-model").value=v.Model;
        toast("VIN decoded ✓");
      }catch(err){ toast("Couldn't reach VIN decoder — type it manually"); }
    });
  }
}

/* ================= add / edit maintenance ================= */
function openAddMaint(mid){
  const m = machineById(mid);
  const have = new Set(itemsFor(mid).map(i=>i.templateId));
  const sugg = templatesFor(m.category, m.make, m.model).filter(t=>!have.has(t.id));
  openSheet(`<h2>Add maintenance</h2><div class="sub">${esc(m.name)} · suggested for this machine</div>
    ${sugg.map((t,i)=>`<button class="toggle-row" data-tid="${t.id}" onclick="this.classList.toggle('sel');this.querySelector('.check-dot').classList.toggle('on')"><span class="check-dot">✓</span><span class="ticon">${icon(t.icon)}</span><span class="tt"><b>${esc(t.title)}</b><span>${esc(intervalTxt({interval:t.interval},{unit:m.unit}))}</span></span></button>`).join("")||'<div class="sub">All suggestions already added.</div>'}
    ${sugg.length?`<button class="btn-primary" onclick="addSuggested('${mid}')">Add selected</button>`:""}
    <button class="btn-secondary" style="margin-top:10px" onclick="openCustomMaint('${mid}')">+ Add custom item</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function addSuggested(mid){
  const tids = $$("#sheet [data-tid].sel").map(b=>b.dataset.tid);
  if(!tids.length){ toast("Pick at least one"); return; }
  const m = machineById(mid);
  for(const tid of tids){
    const t = templatesFor(m.category,m.make,m.model).find(x=>x.id===tid);
    S.items.push({ id:uid(), machineId:mid, templateId:t.id, title:t.title, icon:t.icon, interval:Object.assign({},t.interval),
      first:t.first||null, lastReading:null, lastDate:null, reminderLead:null, enabled:true, parts:t.parts||[], howTo:"", notes:"", snoozedUntil:null, severe:false, skipped:0 });
  }
  save(); closeSheet(); go("machine",{machineId:mid,tab:"upcoming"}); toast("Added ✓");
}
const ICON_CHOICES = ["i-oil","i-blades","i-battery","i-filter","i-plug","i-belt","i-tire","i-coolant","i-grease","i-fuel","i-wrench"];
function openCustomMaint(mid, editId){
  const m = machineById(mid);
  const it = editId?S.items.find(x=>x.id===editId):null;
  const iv = it?it.interval:{};
  openSheet(`<h2>${it?"Edit":"Custom"} maintenance</h2><div class="sub">${esc(m.name)}</div>
    <div class="field"><label>Title</label><input id="cm-title" value="${esc(it?it.title:"")}"></div>
    <div class="field"><label>Icon</label><div class="seg" id="cm-icons">${ICON_CHOICES.map(ic=>`<button data-ic="${ic}" class="${it&&it.icon===ic?"active":""}" style="font-size:0;padding:12px">${icon(ic)}</button>`).join("")}</div></div>
    <div class="field"><label>Every… (fill any)</label><div class="field-row">
      <div class="field"><input type="number" id="cm-hours" placeholder="hours" value="${iv.hours||""}"></div>
      <div class="field"><input type="number" id="cm-miles" placeholder="miles" value="${iv.miles||""}"></div>
      <div class="field"><input type="number" id="cm-months" placeholder="months" value="${iv.months||""}"></div></div></div>
    <div class="field"><label>Remind ahead (days)</label><input type="number" id="cm-lead" value="${it&&it.reminderLeadDays!=null?it.reminderLeadDays:""}"></div>
    <div class="field"><label>Severe-duty interval (optional)</label><div class="field-row">
      <div class="field"><input type="number" id="cm-svh" placeholder="hours" value="${(it&&it.severeInterval&&it.severeInterval.hours)||""}"></div>
      <div class="field"><input type="number" id="cm-svm" placeholder="miles" value="${(it&&it.severeInterval&&it.severeInterval.miles)||""}"></div></div></div>
    <div class="field"><label><input type="checkbox" id="cm-sev" ${it&&it.severe?"checked":""} style="width:auto;min-height:0"> This machine is on severe duty</label></div>
    <div class="field"><label>How-to link</label><input id="cm-how" value="${esc(it?it.howTo:"")}" placeholder="https://…"></div>
    <button class="btn-primary" onclick="saveCustomMaint('${mid}'${it?",'"+it.id+"'":""})">${it?"Save changes":"Add item"}</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>
    <script>$$("#cm-icons button").forEach(b=>b.onclick=()=>{$$("#cm-icons button").forEach(x=>x.classList.remove("active"));b.classList.add("active")})<\/script>`);
}
function saveCustomMaint(mid, editId){
  const title = $("#cm-title").value.trim(); if(!title){ toast("Give it a title"); return; }
  const ic = (($("#cm-icons .active")||{}).dataset||{}).ic || "i-wrench";
  const iv = {};
  const hh=$("#cm-hours").value, mm=$("#cm-miles").value, mo=$("#cm-months").value;
  if(hh) iv.hours=Number(hh); if(mm) iv.miles=Number(mm); if(mo) iv.months=Number(mo);
  const sev = {};
  if($("#cm-svh").value) sev.hours=Number($("#cm-svh").value);
  if($("#cm-svm").value) sev.miles=Number($("#cm-svm").value);
  const data = { title, icon:ic, interval:iv, severeInterval:Object.keys(sev).length?sev:null,
    severe:$("#cm-sev").checked, reminderLeadDays:$("#cm-lead").value===""?null:Number($("#cm-lead").value),
    howTo:$("#cm-how").value.trim() };
  if(editId){ Object.assign(S.items.find(x=>x.id===editId), data); }
  else S.items.push(Object.assign({ id:uid(), machineId:mid, templateId:null, first:null, lastReading:null, lastDate:null, enabled:true, parts:[], notes:"", snoozedUntil:null, skipped:0 }, data));
  save(); closeSheet(); go("machine",{machineId:mid,tab:"upcoming"}); toast("Saved ✓");
}
function resetToRecommended(taskId){
  const it = S.items.find(x=>x.id===taskId);
  const m = machineById(it.machineId);
  const t = templatesFor(m.category,m.make,m.model).find(x=>x.id===it.templateId);
  if(!t){ toast("Custom item — nothing to reset to"); return; }
  it.interval = Object.assign({}, t.interval);
  it.severeInterval = t.severe?Object.assign({},t.severe):null;
  it.title = t.title; it.icon = t.icon; it.parts = t.parts||[];
  save(); render(); toast("Reset to recommended ✓");
}
function openTaskMenu(taskId){
  const it = S.items.find(x=>x.id===taskId);
  openSheet(`<h2>${esc(it.title)}</h2><div class="sub">Task options</div>
    <button class="menu-item" onclick="closeSheet();openCustomMaint('${it.machineId}','${it.id}')"><span class="ticon">✎</span>Edit interval<span class="arr">›</span></button>
    ${it.templateId?`<button class="menu-item" onclick="closeSheet();resetToRecommended('${it.id}')"><span class="ticon">${icon("i-sun")}</span>Reset to recommended<span class="arr">›</span></button>`:""}
    <button class="menu-item" onclick="closeSheet();skipItem('${it.id}')"><span class="ticon">${icon("i-snooze")}</span>Skip this time<span class="arr">›</span></button>
    <button class="menu-item" onclick="disableItem('${it.id}')"><span class="ticon">✕</span>Turn off tracking<span class="arr">›</span></button>`);
}
function disableItem(id){ const it=S.items.find(x=>x.id===id); it.enabled=false; save(); closeSheet(); go("machine",{machineId:it.machineId,tab:"upcoming"}); toast("Tracking off"); }
</script>
<script>
/* ================= receipts / warranties / notes / fuel ================= */
function openReceiptSheet(mid, afterLog){
  const m = machineById(mid);
  openSheet(`<h2>Add receipt</h2><div class="sub">${esc(m.name)}</div>
    <div class="field"><label>Photo (optional)</label><input type="file" id="rc-img" accept="image/*" capture="environment"></div>
    <button class="btn-secondary" id="rc-ocr" style="margin-bottom:14px" onclick="runOCR()">Try reading text from photo (needs internet once)</button>
    <div class="field"><label>Vendor</label><input id="rc-vendor"></div>
    <div class="field-row"><div class="field"><label>Date</label><input type="date" id="rc-date" value="${todayStr()}"></div>
    <div class="field"><label>Total</label><input type="number" id="rc-total" inputmode="decimal"></div></div>
    <div class="field"><label>Category</label><div class="seg" id="rc-cat">${["parts","service","fuel","registration","insurance","other"].map((c,i)=>`<button data-v="${c}" class="${i===0?"active":""}">${c}</button>`).join("")}</div></div>
    <button class="btn-primary" onclick="saveReceipt('${mid}')">Save receipt</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>
    <script>$$("#rc-cat button").forEach(b=>b.onclick=()=>{$$("#rc-cat button").forEach(x=>x.classList.remove("active"));b.classList.add("active")})<\/script>`);
}
async function fileToDataURL(file){
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600/Math.max(img.width,img.height));
  const c = document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.8);
}
async function saveReceipt(mid){
  const imgFile = $("#rc-img").files[0];
  let image=null;
  if(imgFile){ try{ image = await fileToDataURL(imgFile); }catch(e){ toast("Photo couldn't be saved — receipt saved without it"); } }
  const cat = (($("#rc-cat .active")||{}).dataset||{}).v || "parts";
  S.receipts.push({ id:uid(), machineId:mid, serviceLogId:null, image, ocrText:null,
    vendor:$("#rc-vendor").value.trim()||"Receipt", date:$("#rc-date").value||todayStr(),
    total:$("#rc-total").value===""?null:Number($("#rc-total").value), category:cat });
  save(); closeSheet(); go("machine",{machineId:mid,tab:"history"}); toast("Receipt saved ✓");
}
async function runOCR(){
  const file = $("#rc-img").files[0];
  if(!file){ toast("Choose a photo first"); return; }
  toast("Loading scanner… (one-time download)");
  try{
    if(!window.Tesseract){
      await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    const res = await Tesseract.recognize(file, "eng");
    const text = res.data.text||"";
    // vendor = first non-empty line; total = largest money value
    const lines = text.split("\n").map(s=>s.trim()).filter(Boolean);
    if($("#rc-vendor").value==="" && lines.length) $("#rc-vendor").value = lines[0].slice(0,40);
    const monies = [...text.matchAll(/\$?\s?(\d{1,5}\.\d{2})/g)].map(x=>Number(x[1])).filter(n=>n>0);
    if(monies.length) $("#rc-total").value = Math.max(...monies);
    toast("Read what I could — check and fix the fields");
  }catch(e){ toast("Scanner unavailable offline — just type the fields"); }
}
function openWarrantySheet(mid){
  const m = machineById(mid);
  openSheet(`<h2>Add warranty</h2><div class="sub">${esc(m.name)}</div>
    <div class="field"><label>Provider</label><input id="wr-prov"></div>
    <div class="field"><label>Coverage</label><input id="wr-cov" placeholder="e.g. 2-yr extended"></div>
    <div class="field-row"><div class="field"><label>Starts</label><input type="date" id="wr-start" value="${todayStr()}"></div>
    <div class="field"><label>Ends</label><input type="date" id="wr-end"></div></div>
    <div class="field"><label>Policy #</label><input id="wr-pol"></div>
    <button class="btn-primary" onclick="saveWarranty('${mid}')">Save warranty</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function saveWarranty(mid){
  S.warranties.push({ id:uid(), machineId:mid, provider:$("#wr-prov").value.trim()||"Warranty", coverage:$("#wr-cov").value.trim(),
    start:$("#wr-start").value, end:$("#wr-end").value, usageLimit:null, policy:$("#wr-pol").value.trim(), receiptId:null, notes:"" });
  save(); closeSheet(); go("machine",{machineId:mid,tab:"upcoming"}); toast("Warranty saved ✓");
}
function openNoteSheet(mid){
  const m = machineById(mid);
  openSheet(`<h2>Add note</h2><div class="sub">${esc(m.name)}</div>
    <div class="field"><label>Note</label><textarea id="nt-body"></textarea></div>
    <div class="field"><label><input type="checkbox" id="nt-pin" style="width:auto;min-height:0"> Pin it</label></div>
    <button class="btn-primary" onclick="saveNote('${mid}')">Save note</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function saveNote(mid){
  const b=$("#nt-body").value.trim(); if(!b){ toast("Write something first"); return; }
  S.notes.push({ id:uid(), machineId:mid, body:b, date:todayStr(), linkedId:null, pinned:$("#nt-pin").checked });
  save(); closeSheet(); go("machine",{machineId:mid,tab:"notes"}); toast("Note saved ✓");
}
function togglePin(id){ const n=S.notes.find(x=>x.id===id); n.pinned=!n.pinned; save(); render(); }
function deleteNote(id){ const snap=JSON.stringify(S); S.notes=S.notes.filter(x=>x.id!==id); save(); render(); toast("Note deleted",()=>{S=JSON.parse(snap);save();render();}); }
function openFuelSheet(mid){
  const m = machineById(mid);
  openSheet(`<h2>Log fill-up</h2><div class="sub">${esc(m.name)}</div>
    <div class="field"><label>Date</label><input type="date" id="fu-date" value="${todayStr()}"></div>
    <div class="field-row"><div class="field"><label>Odometer</label><input type="number" id="fu-read" inputmode="decimal" value="${m.current||""}"></div>
    <div class="field"><label>Gallons</label><input type="number" id="fu-gal" inputmode="decimal"></div></div>
    <div class="field-row"><div class="field"><label>Price/gal</label><input type="number" id="fu-ppg" inputmode="decimal" step="0.01"></div>
    <div class="field"><label>Total</label><input type="number" id="fu-tot" inputmode="decimal" step="0.01"></div></div>
    <div class="field"><label><input type="checkbox" id="fu-full" checked style="width:auto;min-height:0"> Full tank</label></div>
    <button class="btn-primary" onclick="saveFuel('${mid}')">Save fill-up</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
}
function saveFuel(mid){
  const m=machineById(mid);
  const reading=$("#fu-read").value===""?null:Number($("#fu-read").value);
  const gal=Number($("#fu-gal").value||0), ppg=Number($("#fu-ppg").value||0);
  let tot=$("#fu-tot").value===""?null:Number($("#fu-tot").value);
  if(tot==null && gal&&ppg) tot=+(gal*ppg).toFixed(2);
  S.fuel.push({ id:uid(), machineId:mid, date:$("#fu-date").value||todayStr(), reading, gallons:gal, price:ppg, total:tot||0, full:$("#fu-full").checked });
  if(reading!=null){ m.current=Math.max(m.current||0,reading); S.readings.push({id:uid(),machineId:mid,value:reading,date:$("#fu-date").value||todayStr()}); }
  save(); closeSheet(); render(); toast("Fill-up saved ✓");
}
function openSpecSheet(mid){
  const m=machineById(mid);
  const parts=S.parts.filter(p=>p.machineId===mid);
  openSheet(`<h2>Spec sheet</h2><div class="sub">${esc(m.name)} — oil, filters, plugs, sizes</div>
    <div id="sp-rows">${parts.map((p,i)=>`<div class="field-row" style="margin-bottom:8px">
      <div class="field" style="margin:0"><input placeholder="Type (oil)" value="${esc(p.type)}" data-sp="type" data-i="${i}"></div>
      <div class="field" style="margin:0;flex:1.4"><input placeholder="Spec (10W-30, 2 qt)" value="${esc(p.spec)}" data-sp="spec" data-i="${i}"></div>
      <div class="field" style="margin:0"><input placeholder="Part #" value="${esc(p.part||"")}" data-sp="part" data-i="${i}"></div></div>`).join("")}
    </div>
    <button class="btn-text" id="sp-add" style="width:100%">+ Add row</button>
    <button class="btn-primary" onclick="saveSpecSheet('${mid}')">Save spec sheet</button>
    <button class="btn-text" style="width:100%" onclick="closeSheet()">Cancel</button>`);
  $("#sp-add").onclick=()=>{
    const i=S.parts.filter(p=>p.machineId===mid).length+$$("#sp-rows [data-sp]").length/3;
    $("#sp-rows").innerHTML += `<div class="field-row" style="margin-bottom:8px"><div class="field" style="margin:0"><input placeholder="Type" data-sp="type" data-i="n${i}"></div><div class="field" style="margin:0;flex:1.4"><input placeholder="Spec" data-sp="spec" data-i="n${i}"></div><div class="field" style="margin:0"><input placeholder="Part #" data-sp="part" data-i="n${i}"></div></div>`;
  };
}
function saveSpecSheet(mid){
  const rows={};
  $$("#sp-rows [data-sp]").forEach(inp=>{ const k=inp.dataset.i; rows[k]=rows[k]||{}; rows[k][inp.dataset.sp]=inp.value; });
  S.parts = S.parts.filter(p=>p.machineId!==mid);
  for(const k of Object.keys(rows)){ const r=rows[k]; if(r.type||r.spec||r.part) S.parts.push({id:uid(),machineId:mid,type:r.type||"",spec:r.spec||"",part:r.part||"",store:""}); }
  save(); closeSheet(); render(); toast("Spec sheet saved ✓");
}
function openMachineMenu(mid){
  const m=machineById(mid);
  openSheet(`<h2>${esc(m.name)}</h2><div class="sub">${esc(m.make)} ${esc(m.model)} ${esc(m.year)} · ${esc(DB.categories[m.category].label)}</div>
    <button class="menu-item" onclick="closeSheet();duplicateMachine('${mid}')"><span class="ticon">⧉</span>Duplicate machine<span class="arr">›</span></button>
    <button class="menu-item" onclick="archiveMachine('${mid}',true)"><span class="ticon">${icon("i-garage")}</span>Archive (sold it)<span class="arr">›</span></button>
    <button class="menu-item" onclick="removeMachine('${mid}')"><span class="ticon">✕</span>Delete machine<span class="arr">›</span></button>`);
}
function duplicateMachine(mid){
  const m=machineById(mid); const nid=uid();
  const c=JSON.parse(JSON.stringify(m)); c.id=nid; c.name=m.name+" (2)"; S.machines.push(c);
  for(const it of S.items.filter(i=>i.machineId===mid)){ const ci=JSON.parse(JSON.stringify(it)); ci.id=uid(); ci.machineId=nid; S.items.push(ci); }
  for(const p of S.parts.filter(p=>p.machineId===mid)){ const cp=JSON.parse(JSON.stringify(p)); cp.id=uid(); cp.machineId=nid; S.parts.push(cp); }
  save(); closeSheet(); go("garage"); toast("Duplicated ✓");
}
function archiveMachine(mid){ const m=machineById(mid); m.archived=true; save(); closeSheet(); go("garage"); toast("Archived — history kept"); }
function removeMachine(mid){
  const snap=JSON.stringify(S);
  S.machines=S.machines.filter(x=>x.id!==mid); S.items=S.items.filter(x=>x.machineId!==mid);
  save(); closeSheet(); go("garage");
  toast("Machine deleted",()=>{S=JSON.parse(snap);save();render();});
}
function openServiceSearch(cat){
  const q = { "riding-mower":"small engine repair near me", "generator":"generator repair near me", "truck":"auto repair near me", "tractor":"tractor repair near me" }[cat] || "equipment repair near me";
  window.open("https://www.google.com/maps/search/"+encodeURIComponent(q), "_blank");
}

/* ================= checklists ================= */
function openChecklist(mid, kind){
  const m=machineById(mid);
  const lists = DB.seasonal[m.category]||{};
  const list = lists[kind]||[];
  const flags = {};
  const title = kind==="spring"?"Spring startup":"Winter storage";
  const render2=()=>{
    openSheet(`<h2>${title}</h2><div class="sub">${esc(m.name)}</div>
      ${list.map((c,i)=>`<button class="check-item ${flags[i]?"done":""}" data-ci="${i}"><span class="check-dot ${flags[i]?"on":""}">✓</span><span class="ct">${esc(c)}</span></button>`).join("")}
      <button class="btn-primary" style="margin-top:14px" onclick="finishChecklist('${mid}','${kind}')">Log checklist as done</button>
      <button class="btn-text" style="width:100%" onclick="closeSheet()">Close</button>`);
    $$("#sheet .check-item").forEach(b=>b.onclick=()=>{ flags[b.dataset.ci]=!flags[b.dataset.ci]; b.classList.toggle("done"); b.querySelector(".check-dot").classList.toggle("on"); });
  };
  render2();
}
function finishChecklist(mid, kind){
  const m=machineById(mid);
  S.logs.push({ id:uid(), machineId:mid, scheduleItemId:null, date:todayStr(), reading:m.current,
    title:(kind==="spring"?"Spring startup":"Winter storage")+" checklist", parts:[], laborCost:0, shop:"DIY", total:0, notes:"", receiptIds:[], createdAt:todayStr() });
  save(); closeSheet(); go("machine",{machineId:mid,tab:"history"}); toast("Checklist logged ✓");
}

/* ================= export / import ================= */
function download(name, content, type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportJSON(){
  download("bills-garage-backup.json", JSON.stringify(S,null,2), "application/json");
  S.settings.lastBackup = todayStr(); save(); toast("Backup downloaded ✓");
}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.machines) throw 0; S=j; save(); go("garage"); toast("Backup restored ✓"); }catch(e){ toast("That file didn't look like a backup"); } };
  r.readAsText(f);
}
function exportCSV(){
  const rows=[["type","machine","title","date","reading","cost","notes"]];
  for(const l of S.logs){ const m=machineById(l.machineId); rows.push(["service",m?m.name:"",l.title,l.date,l.reading??"",l.total??"",l.notes||""]); }
  for(const f of S.fuel){ const m=machineById(f.machineId); rows.push(["fuel",m?m.name:"","Fill-up",f.date,f.reading??"",f.total??"",f.gallons+" gal"]); }
  for(const w of S.warranties){ const m=machineById(w.machineId); rows.push(["warranty",m?m.name:"",w.provider+" "+w.coverage,w.end,"","",""]); }
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  download("bills-garage.csv", csv, "text/csv"); toast("CSV downloaded ✓");
}
function icsEscape(s){ return String(s).replace(/[\\,;]/g, m=>"\\"+m); }
function exportItemICS(itemId){
  const it=S.items.find(x=>x.id===itemId); if(!it) return;
  const st=itemStatus(it, machineById(it.machineId));
  const d = st.dueDate || st.etaDate; if(!d){ toast("No due date to export"); return; }
  const ymd = d.replace(/-/g,"");
  download("maintenance.ics", ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bills Garage//EN","BEGIN:VEVENT",
    "UID:"+it.id+"@bills-garage","DTSTAMP:"+ymd+"T120000Z","DTSTART;VALUE=DATE:"+ymd,
    "SUMMARY:"+icsEscape("Maintenance: "+it.title+" — "+machineById(it.machineId).name),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n"),
    "text/calendar");
  toast("Calendar file saved ✓");
}
function exportAllICS(){
  const ups = allUpcoming();
  const evts = [];
  for(const u of ups){
    const d = u.st.dueDate || u.st.etaDate; if(!d) continue;
    const ymd = d.replace(/-/g,"");
    evts.push(["BEGIN:VEVENT","UID:"+u.item.id+"@bills-garage","DTSTAMP:"+ymd+"T120000Z","DTSTART;VALUE=DATE:"+ymd,
      "SUMMARY:"+icsEscape("Maintenance: "+u.item.title+" — "+u.machine.name),
      "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","END:VALARM","END:VEVENT"].join("\r\n"));
  }
  if(!evts.length){ toast("No dated items to export"); return; }
  download("bills-garage-upcoming.ics", ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bills Garage//EN",...evts,"END:VCALENDAR"].join("\r\n"), "text/calendar");
  toast("Calendar file saved ✓");
}
function printReport(){
  const win = window.open("", "_blank");
  if(!win){ toast("Allow popups to print the report"); return; }
  let rows="";
  for(const m of S.machines){
    const logs = S.logs.filter(l=>l.machineId===m.id).sort((a,b)=>a.date<b.date?-1:1);
    rows += `<h2 style="font-family:sans-serif">${esc(m.name)} — ${esc(m.make)} ${esc(m.model)} ${esc(m.year)}</h2>`+
      (logs.length?`<table border="1" cellspacing="0" cellpadding="6" style="font-family:sans-serif;border-collapse:collapse"><tr><th>Date</th><th>Service</th><th>Reading</th><th>Cost</th></tr>${logs.map(l=>`<tr><td>${l.date}</td><td>${esc(l.title)}</td><td>${l.reading??""}</td><td>${money(l.total)}</td></tr>`).join("")}</table>`:"<p>No services recorded.</p>");
  }
  win.document.write(`<html><head><title>Service history</title></head><body><h1 style="font-family:sans-serif">Bill's Garage — Service History</h1>${rows}</body></html>`);
  win.document.close(); win.focus(); setTimeout(()=>win.print(), 400);
}
function setLead(d){ S.settings.defaultLeadDays=d; save(); render(); }
function resetDemo(){ if(confirm("Reset all data back to the demo garage? Your entries will be erased.")){ localStorage.removeItem(STORE_KEY); S=seedState(); save(); go("garage"); toast("Reset ✓"); } }

/* ================= onboarding (first run) ================= */
let OB = 0;
const OB_PAGES = [
  { h:"BILL'S GARAGE", p:"Every machine you own, and everything it needs — in one place. No more guessing when the oil was last changed." },
  { h:"ADD YOUR MACHINES", p:"Pick the kind of machine, and the app suggests its whole maintenance schedule. Adjust anything — your manual wins." },
  { h:"LOG IN SECONDS", p:"Tap Log, confirm, done. The next due date figures itself out. Works offline in the garage." }
];
function showOnboarding(){
  const ob=$("#onboard"); ob.classList.add("open"); OB=0; drawOB();
}
function drawOB(){
  const p=OB_PAGES[OB];
  const lineup = S?S.machines.slice(0,3).map(m=>machineArt(m,"120px","80px")).join(""):"";
  $("#onboard").innerHTML = `<div class="olineup"><div style="display:flex;gap:8px">${lineup}</div></div>
    <h1>${p.h}</h1><p>${p.p}</p>
    <div class="dots">${OB_PAGES.map((x,i)=>`<i class="${i===OB?"on":""}"></i>`).join("")}</div>
    <button class="btn-primary" onclick="obNext()">${OB<OB_PAGES.length-1?"Next":"Get started"}</button>
    <button class="btn-text" style="width:100%;margin-top:8px" onclick="obDone()">Skip</button>`;
}
function obNext(){ if(OB<OB_PAGES.length-1){ OB++; drawOB(); } else obDone(); }
function obDone(){ S.onboarded=true; save(); $("#onboard").classList.remove("open"); }

/* ================= init ================= */
function bindCommon(root){}
load();
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
if(!S.onboarded) showOnboarding();
</script>
